<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Optimal Route</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#1f2937}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin-bottom:16px}
    h1{font-size:24px;margin:0 0 6px}
    .sub{font-size:13px;color:#6b7280;margin-bottom:18px}
    textarea{width:100%;min-height:420px;border:1px solid #d1d5db;border-radius:10px;padding:14px;font-family:Consolas,monospace;font-size:12px;resize:vertical}
    button{border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}
    #runBtn{background:#111827;color:#fff}
    #runBtn:disabled{opacity:.45;cursor:not-allowed}
    .status{margin-left:12px;font-size:13px;color:#6b7280}
    .row{display:flex;align-items:center;margin-top:14px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
    .metric{border:1px solid #e5e7eb;border-radius:10px;padding:12px}
    .metric .k{font-size:11px;color:#6b7280}
    .metric .v{font-size:18px;font-weight:700;margin-top:4px}
    pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border-radius:10px;padding:14px;font-size:12px;max-height:420px;overflow:auto}
    .hidden{display:none}
    @media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Wind Optimal Route</h1>
    <div class="sub">PPS Flight Plan 전체를 그대로 붙여넣으세요. 계획 고도는 유지하고, waypoint 예상 통과시간에 맞는 GFS로 수평 Route를 최적화합니다.</div>
    <textarea id="planText" placeholder="PPS Flight Plan 전체 내용을 Ctrl+A → Ctrl+C 후 여기에 붙여넣기"></textarea>
    <div class="row">
      <button id="runBtn" onclick="runOptimize()">OPTIMIZE</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="card hidden" id="resultCard">
    <div id="title" style="font-weight:700"></div>
    <div class="grid">
      <div class="metric"><div class="k">PPS ETE</div><div class="v" id="origEte">-</div></div>
      <div class="metric"><div class="k">OPT ETE</div><div class="v" id="optEte">-</div></div>
      <div class="metric"><div class="k">ETE 차이</div><div class="v" id="diffEte">-</div></div>
      <div class="metric"><div class="k">PACOTS Crossings</div><div class="v" id="crossings">-</div></div>
    </div>
    <h3>Optimized Route</h3>
    <pre id="routeOut"></pre>
    <h3>상세 JSON</h3>
    <pre id="jsonOut"></pre>
  </div>
</div>

<script>
/*
 * 반드시 본인의 Apps Script Web App /exec URL로 변경
 */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzG5kwQ5PYMXFhIWoRESTX3fpkMeQcaegmykYiLHKSJXS3CpG74qRePkcFSIzD88Jwo/exec';

async function runOptimize(){
  const text = document.getElementById('planText').value.trim();
  if(!text){ alert('PPS Flight Plan 전체 내용을 붙여넣어 주세요.'); return; }
  if(BACKEND_URL.includes('PASTE_YOUR')){
    alert('index.html의 BACKEND_URL을 Apps Script /exec URL로 변경해 주세요.');
    return;
  }

  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = 'Flight Plan 분석 및 GFS 조회 중...';

  try{
    const r = await fetch(BACKEND_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'optimizePlan',planText:text})
    });

    const raw = await r.text();
    let data;
    try{ data = JSON.parse(raw); }
    catch(e){ throw new Error('백엔드가 JSON이 아닌 응답을 반환했습니다.\\n' + raw.slice(0,500)); }

    if(!data.ok) throw new Error(data.error || 'Unknown backend error');
    renderResult(data.result);
    status.textContent = '완료';
  }catch(err){
    console.error(err);
    status.textContent = '오류';
    alert(err.message || String(err));
  }finally{
    btn.disabled = false;
  }
}

function renderResult(r){
  document.getElementById('resultCard').classList.remove('hidden');
  const s = r.summary;
  document.getElementById('title').textContent =
    `${r.parsedPlan.origin || ''} → ${r.parsedPlan.destination || ''} · ${s.decision}`;
  document.getElementById('origEte').textContent = fmtSec(s.originalEteSec);
  document.getElementById('optEte').textContent = fmtSec(s.optimizedEteSec);
  document.getElementById('diffEte').textContent =
    (s.eteDifferenceSec >= 0 ? '+' : '-') + fmtSec(Math.abs(s.eteDifferenceSec));
  document.getElementById('crossings').textContent =
    `${s.optimizedPacotsCrossings} / 2`;

  document.getElementById('routeOut').textContent =
    r.optimizedRoute.map(p =>
      `${p.name}  ${p.lat.toFixed(3)},${p.lon.toFixed(3)}  FL${p.fl || '-'}  ${shortUtc(p.etaUtc)}  ${p.windDir ?? '-'}°/${p.windKt ?? '-'}kt`
    ).join('\\n');

  document.getElementById('jsonOut').textContent = JSON.stringify(r,null,2);
}

function fmtSec(sec){
  if(!Number.isFinite(sec)) return '-';
  const sign = sec < 0 ? '-' : '';
  sec = Math.round(Math.abs(sec));
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  return `${sign}${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function shortUtc(s){
  if(!s) return '-';
  const d = new Date(s);
  return `${String(d.getUTCDate()).padStart(2,'0')} ${String(d.getUTCHours()).padStart(2,'0')}${String(d.getUTCMinutes()).padStart(2,'0')}Z`;
}
</script>
</body>
</html>
