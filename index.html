<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wind Optimal Route</title>

  <style>
    :root{
      --bg:#0b1020;
      --panel:#121a2d;
      --line:#273454;
      --text:#eef3ff;
      --muted:#9fb0d0;
      --accent:#2f78db;
      --good:#67d391;
      --bad:#ff8c8c;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:24px
    }

    h1{margin:0 0 6px;font-size:25px}
    h2{margin:0 0 14px;font-size:17px}

    .muted{
      color:var(--muted);
      font-size:13px
    }

    .grid{
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:18px;
      margin-top:18px
    }

    .card{
      padding:16px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px
    }

    .sp{height:12px}

    label{
      display:block;
      margin-bottom:6px;
      color:var(--muted);
      font-size:12px
    }

    textarea,select,input,button{
      width:100%;
      border:1px solid var(--line);
      border-radius:10px;
      background:#0d1426;
      color:var(--text);
      padding:10px;
      font:inherit
    }

    textarea{
      min-height:360px;
      resize:vertical;
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-size:12px;
      line-height:1.45
    }

    button{
      cursor:pointer;
      background:#1d5fbf;
      border-color:var(--accent);
      font-weight:700
    }

    button.secondary{
      background:#18233d;
      border-color:var(--line)
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed
    }

    .status{
      margin-top:12px;
      font-size:13px;
      white-space:pre-wrap
    }

    .ok{color:var(--good)}
    .err{color:var(--bad)}

    .results{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:16px;
      align-items:stretch
    }

    .result-box{
      border:1px solid var(--line);
      border-radius:14px;
      background:#0d1426;
      padding:16px
    }

    .result-title{
      color:var(--muted);
      font-size:12px;
      margin-bottom:8px
    }

    .result-time{
      font-size:28px;
      font-weight:800
    }

    .result-wind{
      margin-top:8px;
      color:var(--muted);
      font-size:13px
    }

    .arrow{
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:24px
    }

    .saving{
      margin-top:14px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:12px;
      text-align:center;
      font-weight:800
    }

    .output-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:14px
    }


    .route-preview{
      margin-top:16px;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#0d1426;
    }

    .route-preview-title{
      color:var(--muted);
      font-size:12px;
      margin-bottom:8px;
    }

    .route-preview-text{
      font-size:13px;
      line-height:1.6;
      word-break:break-word;
      color:var(--text);
    }

    @media(max-width:800px){
      .grid{grid-template-columns:1fr}
      .results{grid-template-columns:1fr}
      .arrow{transform:rotate(90deg)}
    }

    @media(max-width:600px){
      .row,.output-actions{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <div id="authScreen" style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#0b1020;
    color:#eef3ff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  ">
    승인 확인 중...
  </div>

  <div id="appRoot" style="display:none;">
  <div class="wrap">
    <h1>Wind Optimal Route</h1>
    <div class="muted">
      GPX RAW → A/B 선택 → GFS 상층풍 + 거리 기준 최소 ETE route
    </div>

    <div class="grid">
      <section class="card">
        <h2>1. GPX RAW 붙여넣기</h2>

        <textarea
          id="gpx"
          placeholder="<?xml version=&quot;1.0&quot; ...> ... </gpx>"
        ></textarea>

        <div class="sp"></div>

        <div class="row">
          <button id="parseBtn" class="secondary" type="button">
            GPX 읽기
          </button>

          <button id="clearBtn" class="secondary" type="button">
            초기화
          </button>
        </div>

        <div id="parseStatus" class="status muted"></div>
      </section>

      <section class="card">
        <h2>2. 분석 조건</h2>

        <div class="row">
          <div>
            <label for="aSel">A waypoint</label>
            <select id="aSel">
              <option>GPX를 먼저 읽어주세요</option>
            </select>
          </div>

          <div>
            <label for="bSel">B waypoint</label>
            <select id="bSel">
              <option>GPX를 먼저 읽어주세요</option>
            </select>
          </div>
        </div>

        <div class="sp"></div>

        <div class="row">
          <div>
            <label for="analysisDate">Analysis Date (UTC)</label>
            <input id="analysisDate" type="date">
          </div>

          <div>
            <label for="fl">Flight Level</label>
            <input id="fl" type="number" value="390" min="100" max="500" step="10">
          </div>
        </div>

        <div class="sp"></div>


        <button id="runBtn" type="button">
          최적 Route 계산
        </button>

        <div id="runStatus" class="status muted"></div>

        <div class="route-preview">
          <div class="route-preview-title">Original Route</div>
          <div id="originalRoutePreview" class="route-preview-text">
            GPX를 읽으면 전체 Route가 표시됩니다.
          </div>
        </div>
      </section>
    </div>

    <div class="sp"></div>

    <section class="card" id="resultCard" hidden>
      <h2>3. 결과</h2>

      <div class="results">
        <div class="result-box">
          <div class="result-title">기존 · 전체 Route</div>
          <div class="result-time" id="originalTime">-</div>
          <div class="result-wind" id="originalWind">Avg Tailwind -</div>
          <div class="result-wind" id="originalDistance">Distance -</div>
        </div>

        <div class="arrow">→</div>

        <div class="result-box">
          <div class="result-title">수정 후 · 전체 Route</div>
          <div class="result-time" id="finalTime">-</div>
          <div class="result-wind" id="finalWind">Avg Tailwind -</div>
          <div class="result-wind" id="finalDistance">Distance -</div>
        </div>
      </div>

      <div class="saving" id="saving">-</div>

      <div class="sp"></div>

      <div class="result-box">
        <div class="result-title">Optimized Full Route</div>
        <div id="routeInfo" style="font-size:13px;line-height:1.6;word-break:break-word">
          -
        </div>
      </div>

      <div class="output-actions">
        <button id="copyRouteBtn" type="button" class="secondary">
          Route text 복사
        </button>

        <button id="openSkyVectorBtn" type="button">
          SkyVector에서 보기
        </button>
      </div>

      <div class="sp"></div>

      <div class="result-box" id="candidateDiagnosticBox">
        <div class="result-title">A~B Optimizer Diagnostic</div>
        <div id="candidateDiagnostic">-</div>
      </div>
    </section>
  </div>
  </div>

<script>
(() => {
  'use strict';

  const BACKEND_URL =
    'https://script.google.com/macros/s/AKfycbzG5kwQ5PYMXFhIWoRESTX3fpkMeQcaegmykYiLHKSJXS3CpG74qRePkcFSIzD88Jwo/exec';

  const $ = id => document.getElementById(id);

  let wpts = [];
  let lastResult = null;
  let lastSelection = null;
  let WIND_APP_STARTED = false;


  function utcTodayString(){
    const d = new Date();

    return [
      d.getUTCFullYear(),
      String(d.getUTCMonth()+1).padStart(2,'0'),
      String(d.getUTCDate()).padStart(2,'0')
    ].join('-');
  }



  function parseGpx(xmlText){
    const doc =
      new DOMParser().parseFromString(
        xmlText,
        'application/xml'
      );

    if(doc.querySelector('parsererror')){
      throw new Error('GPX XML 형식이 올바르지 않습니다.');
    }

    const pts =
      [...doc.getElementsByTagNameNS('*','rtept')];

    if(!pts.length){
      throw new Error('GPX에서 rtept를 찾지 못했습니다.');
    }

    return pts.map((el,i)=>{
      const nameEl =
        [...el.children].find(
          x => x.localName === 'name'
        );

      const lat = Number(el.getAttribute('lat'));
      const lon = Number(el.getAttribute('lon'));

      if(!Number.isFinite(lat) || !Number.isFinite(lon)){
        throw new Error('잘못된 waypoint 좌표가 있습니다.');
      }

      return {
        name:(nameEl?.textContent || `WP${i+1}`).trim(),
        lat,
        lon
      };
    });
  }


  function fillSelectors(){
    const html =
      wpts.map((p,i)=>(
        `<option value="${i}">` +
        `${escapeHtml(p.name)} ` +
        `(${p.lat.toFixed(4)}, ${p.lon.toFixed(4)})` +
        `</option>`
      )).join('');

    $('aSel').innerHTML = html;
    $('bSel').innerHTML = html;

    $('aSel').value = '0';
    $('bSel').value = String(wpts.length-1);

    updateOriginalRoutePreview();
  }


  function updateOriginalRoutePreview(){
    if(!wpts.length){
      $('originalRoutePreview').textContent =
        'GPX를 읽으면 전체 Route가 표시됩니다.';
      return;
    }

    $('originalRoutePreview').textContent =
      wpts
        .map(p => p.name)
        .join(' → ');
  }


  $('parseBtn').addEventListener('click',()=>{
    try{
      wpts = parseGpx($('gpx').value);
      fillSelectors();

      $('parseStatus').className = 'status ok';
      $('parseStatus').textContent =
        `${wpts.length}개 waypoint 추출 완료: ` +
        `${wpts[0].name} → ${wpts[wpts.length-1].name}`;

    }catch(err){
      $('parseStatus').className = 'status err';
      $('parseStatus').textContent = err.message;
    }
  });


  $('clearBtn').addEventListener('click',()=>{
    $('gpx').value = '';
    wpts = [];
    lastResult = null;
    lastSelection = null;

    $('aSel').innerHTML =
      '<option>GPX를 먼저 읽어주세요</option>';

    $('bSel').innerHTML =
      '<option>GPX를 먼저 읽어주세요</option>';

    $('parseStatus').textContent = '';
    $('runStatus').textContent = '';
    $('originalRoutePreview').textContent =
      'GPX를 읽으면 전체 Route가 표시됩니다.';
    $('resultCard').hidden = true;
  });


  $('aSel').addEventListener('change', updateOriginalRoutePreview);
  $('bSel').addEventListener('change', updateOriginalRoutePreview);


  $('runBtn').addEventListener('click',async()=>{
    const btn = $('runBtn');

    try{
      if(!wpts.length){
        throw new Error('먼저 GPX를 읽어주세요.');
      }

      const ai = Number($('aSel').value);
      const bi = Number($('bSel').value);

      if(!Number.isInteger(ai) || !Number.isInteger(bi)){
        throw new Error('A/B waypoint를 선택하세요.');
      }

      if(ai >= bi){
        throw new Error(
          'B waypoint는 GPX상 A waypoint 뒤에 있어야 합니다.'
        );
      }

      const analysisDate = $('analysisDate').value;

      if(!analysisDate){
        throw new Error('Analysis Date를 선택하세요.');
      }

      const fl = Number($('fl').value);

      if(!Number.isFinite(fl) || fl < 100 || fl > 500){
        throw new Error('Flight Level을 확인하세요.');
      }

      const originalRoute =
        wpts.slice(ai,bi+1).map(p=>({
          name:p.name,
          lat:p.lat,
          lon:p.lon
        }));

      const fullRoute =
        wpts.map(p=>({
          name:p.name,
          lat:p.lat,
          lon:p.lon
        }));

      const payload = {
        action:'optimize',
        analysisDate,
        flightLevel:fl,
        originalRoute,
        fullRoute,
        aIndex:ai,
        bIndex:bi
      };

      btn.disabled = true;

      $('runStatus').className = 'status muted';
      $('runStatus').textContent =
        'GFS 상층풍 조회 및 최적 route 계산 중...';

      const res =
        await fetch(
          BACKEND_URL,
          {
            method:'POST',
            headers:{
              'Content-Type':'text/plain;charset=utf-8'
            },
            body:JSON.stringify(payload),
            redirect:'follow'
          }
        );

      const text = await res.text();

      let data;

      try{
        data = JSON.parse(text);
      }catch(_){
        throw new Error(
          '백엔드가 JSON이 아닌 응답을 반환했습니다. ' +
          'Apps Script 실행 기록을 확인하세요.\n' +
          text.slice(0,300)
        );
      }

if(!data.ok){
  throw new Error(data.error || 'Backend error');
}

if(!data.result || !data.result.summary){
  console.error('Unexpected backend response:', data);

  throw new Error(
    '백엔드 응답 형식이 올바르지 않습니다. ' +
    'Apps Script 최신 버전이 배포되었는지 확인하세요.'
  );
}

lastResult = data.result;
lastSelection = {ai,bi};

renderResult(data.result);

      $('runStatus').className = 'status ok';
      $('runStatus').textContent = '계산 완료.';

    }catch(err){
      $('runStatus').className = 'status err';
      $('runStatus').textContent = err.message;

    }finally{
      btn.disabled = false;
    }
  });


  function renderResult(r){
    const s = r.summary;

    $('resultCard').hidden = false;

    $('originalTime').textContent =
      formatSeconds(s.originalEteSec);

    $('finalTime').textContent =
      formatSeconds(s.finalEteSec);

    $('originalWind').textContent =
      'Avg Tailwind ' +
      signed(s.originalAvgTailwindKt,' kt');

    $('finalWind').textContent =
      'Avg Tailwind ' +
      signed(s.finalAvgTailwindKt,' kt');

    $('originalDistance').textContent =
      'Distance ' + Number(s.originalDistanceNm || 0).toFixed(0) + ' NM';

    const deltaNm =
      Number(s.finalDistanceNm || 0) - Number(s.originalDistanceNm || 0);

    $('finalDistance').textContent =
      'Distance ' + Number(s.finalDistanceNm || 0).toFixed(0) + ' NM' +
      (Math.abs(deltaNm) >= 0.5
        ? ' (' + (deltaNm >= 0 ? '+' : '') + deltaNm.toFixed(0) + ' NM)'
        : '');

    if(s.changed && s.timeSavingSec > 0){
      $('saving').textContent =
        formatSeconds(s.timeSavingSec) + ' 단축';

      $('saving').className = 'saving ok';

    }else{
      $('saving').textContent = '변화 없음';
      $('saving').className = 'saving muted';
    }

    renderCandidateDiagnostic(r);

    const routeText =
      buildFullPoints()
        .map(p => {
          if (p.name && !/^OPT\d+$/i.test(p.name)) {
            return p.name;
          }
          return coordinateToken(p.lat, p.lon);
        })
        .join('  →  ');

    $('routeInfo').textContent =
      routeText || '-';

    $('resultCard').scrollIntoView({
      behavior:'smooth',
      block:'start'
    });
  }


  function renderCandidateDiagnostic(r){
    const seg = r && r.segmentSummary;
    const cand = r && r.candidateSummary;
    const el = $('candidateDiagnostic');

    if(!el){
      return;
    }

    if(!seg || !cand){
      el.textContent =
        '진단 정보가 없습니다. 최신 Diagnostic 백엔드가 배포되었는지 확인하세요.';
      return;
    }

    const originalWind = Number(seg.originalAvgTailwindKt || 0);
    const candidateWind = Number(cand.avgTailwindKt || 0);
    const deltaSec = Number(cand.deltaEteSecVsOriginal || 0);
    const deltaNm = Number(cand.deltaDistanceNmVsOriginal || 0);

    const decisionText = cand.selected
      ? 'Best Candidate 채택'
      : '기존 Route 유지';

    const eteDiffText = cand.selected
      ? formatSignedDuration(deltaSec)
      : formatSignedDuration(deltaSec);

    el.innerHTML = `
      <div style="
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin-top:4px;
      ">
        <div style="
          padding:11px 12px;
          border:1px solid var(--line);
          border-radius:10px;
          background:#0b1222;
          line-height:1.65;
          font-size:13px;
        ">
          <div style="font-weight:800;margin-bottom:4px;">Original A~B</div>
          <div>ETE <strong>${formatSeconds(seg.originalEteSec)}</strong></div>
          <div>Distance <strong>${Number(seg.originalDistanceNm || 0).toFixed(0)} NM</strong></div>
          <div>Avg Wind <strong>${windLabel(originalWind)}</strong></div>
        </div>

        <div style="
          padding:11px 12px;
          border:1px solid var(--line);
          border-radius:10px;
          background:#0b1222;
          line-height:1.65;
          font-size:13px;
        ">
          <div style="font-weight:800;margin-bottom:4px;">Best Candidate</div>
          <div>ETE <strong>${formatSeconds(cand.eteSec)}</strong></div>
          <div>Distance <strong>${Number(cand.distanceNm || 0).toFixed(0)} NM</strong></div>
          <div>Avg Wind <strong>${windLabel(candidateWind)}</strong></div>
        </div>
      </div>

      <div style="
        margin-top:10px;
        padding:10px 12px;
        border:1px solid var(--line);
        border-radius:10px;
        background:#0b1222;
        font-size:13px;
        line-height:1.65;
      ">
        <div><strong>판정</strong> · ${decisionText}</div>
        <div>ETE 차이 · <strong>${eteDiffText}</strong></div>
        <div>거리 차이 · <strong>${signed0(deltaNm, ' NM')}</strong></div>
        <div>Wind · <strong>${windLabel(originalWind)} → ${windLabel(candidateWind)}</strong></div>
        <div>Points · <strong>${Number(cand.originalPointCount || 0)} → ${Number(cand.pointCount || 0)}</strong></div>
      </div>
    `;
  }

  function windLabel(value){
    const n = Number(value) || 0;

    if(n < 0){
      return 'H' + Math.abs(n).toFixed(1) + ' kt';
    }

    return 'T' + n.toFixed(1) + ' kt';
  }


  function formatSignedDuration(sec){
    const n = Math.round(Number(sec) || 0);
    const abs = Math.abs(n);
    const h = Math.floor(abs / 3600);
    const m = Math.floor((abs % 3600) / 60);
    const s = abs % 60;

    const body = h > 0
      ? h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0')
      : m + 'm ' + s + 's';

    return (n > 0 ? '+' : n < 0 ? '-' : '±') + body;
  }


  function signed0(value,suffix=''){
    const n = Number(value) || 0;
    return (n >= 0 ? '+' : '') + n.toFixed(0) + suffix;
  }


  $('copyRouteBtn').addEventListener('click',async()=>{
    try{
      const text = buildFullRouteText();

      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
      }else{
        fallbackCopy(text);
      }

      $('runStatus').className = 'status ok';
      $('runStatus').textContent = 'Route text를 복사했습니다.';

    }catch(err){
      $('runStatus').className = 'status err';
      $('runStatus').textContent =
        '복사 실패: ' + err.message;
    }
  });


$('openSkyVectorBtn').addEventListener('click', () => {
  try {
    const points = buildFullPoints();
    const routeText = buildSkyVectorRouteText();
    const view = getRouteView(points);

    if (!routeText) {
      throw new Error('먼저 최적 Route를 계산하세요.');
    }

    // SkyVector chart=304에서는 숫자가 커질수록 더 넓은 범위를 보여준다.
    // Route 전체 범위를 계산해서 중심 + zoom을 자동 지정한다.
    const zoom = view ? view.zoom : 10;

    let skyVectorUrl =
      'https://skyvector.com/?chart=304' +
      '&zoom=' + zoom +
      '&fpl=' + encodeURIComponent(routeText);

    if (view) {
      skyVectorUrl +=
        '&ll=' +
        view.lat.toFixed(4) +
        ',' +
        view.lon.toFixed(4);
    }

    window.open(
      skyVectorUrl,
      '_blank',
      'noopener,noreferrer'
    );

    $('runStatus').className = 'status ok';
    $('runStatus').textContent =
      'SkyVector를 새 탭에서 열었습니다.';

  } catch (err) {
    $('runStatus').className = 'status err';
    $('runStatus').textContent =
      'SkyVector 열기 실패: ' + err.message;
  }
});

  function buildFullPoints(){
    if(!lastResult || !lastSelection){
      throw new Error('먼저 최적 Route를 계산하세요.');
    }

    const {ai,bi} = lastSelection;

    return [
      ...wpts.slice(0,ai),
      ...lastResult.finalSegment,
      ...wpts.slice(bi+1)
    ];
  }


  function buildFullRouteText(){
    return buildFullPoints()
      .map(p=>{
        if(
          p.name &&
          !/^OPT\d+$/i.test(p.name)
        ){
          return p.name;
        }

        return coordinateToken(p.lat,p.lon);
      })
      .join(' ');
  }


  // SkyVector의 fpl 파라미터는 마지막 토큰을 목적지 공항으로 해석할 수 있다.
  // 예: 마지막 waypoint가 TOU이면 Touho Airport(NWWU)로 자동 해석될 수 있음.
  // 따라서 실제 공항 ICAO(4글자)가 아닌 첫/마지막 waypoint는 좌표로 전달하여
  // waypoint 위치를 정확히 보존한다. 내부 waypoint 이름은 기존 그대로 유지한다.
  function buildSkyVectorRouteText(){
    const points = buildFullPoints();

    return points
      .map((p,i)=>{
        const isEdge = i === 0 || i === points.length - 1;
        const name = String(p.name || '').trim().toUpperCase();
        const isOptimizedName = /^OPT\d+$/i.test(name);
        const isIcaoAirport = /^[A-Z]{4}$/.test(name);

        if(isEdge && !isIcaoAirport){
          return coordinateToken(p.lat,p.lon);
        }

        if(name && !isOptimizedName){
          return name;
        }

        return coordinateToken(p.lat,p.lon);
      })
      .join(' ');
  }

function getRouteView(points){
  if(!Array.isArray(points) || !points.length){
    return null;
  }

  let minLat = Infinity;
  let maxLat = -Infinity;
  let minLon = Infinity;
  let maxLon = -Infinity;

  // 날짜변경선을 넘는 태평양 Route 대응.
  // 첫 waypoint longitude를 기준으로 longitude를 연속 좌표로 펼친다.
  const refLon = Number(points[0].lon);

  points.forEach(p => {
    const lat = Number(p.lat);
    let lon = Number(p.lon);

    if(!Number.isFinite(lat) || !Number.isFinite(lon)){
      return;
    }

    while(lon - refLon > 180) lon -= 360;
    while(lon - refLon < -180) lon += 360;

    minLat = Math.min(minLat, lat);
    maxLat = Math.max(maxLat, lat);
    minLon = Math.min(minLon, lon);
    maxLon = Math.max(maxLon, lon);
  });

  if(
    !Number.isFinite(minLat) ||
    !Number.isFinite(maxLat) ||
    !Number.isFinite(minLon) ||
    !Number.isFinite(maxLon)
  ){
    return null;
  }

  const lat = (minLat + maxLat) / 2;
  let lon = (minLon + maxLon) / 2;

  while(lon > 180) lon -= 360;
  while(lon < -180) lon += 360;

  const latSpan = maxLat - minLat;
  const lonSpan = maxLon - minLon;

  // 위도가 높을수록 같은 경도 차이의 실제 동서 폭은 줄어드므로 보정.
  const lonSpanAdjusted =
    lonSpan * Math.max(0.35, Math.cos(lat * Math.PI / 180));

  // 화면 가장자리에 route가 붙지 않도록 약 25% 여유를 둔다.
  const span = Math.max(latSpan, lonSpanAdjusted) * 1.25;

  // SkyVector chart=304는 zoom 숫자가 커질수록 더 넓게 보인다.
  // 장거리/태평양 횡단은 10~12 수준으로 자동 zoom-out.
  let zoom;

  if(span >= 80){
    zoom = 12;
  }else if(span >= 55){
    zoom = 10;
  }else if(span >= 35){
    zoom = 8;
  }else if(span >= 22){
    zoom = 6;
  }else if(span >= 12){
    zoom = 4;
  }else if(span >= 6){
    zoom = 2;
  }else{
    zoom = 1;
  }

  return {
    lat,
    lon,
    zoom,
    latSpan,
    lonSpan
  };
}

  function buildFullGpx(){
    const points = buildFullPoints();

    const routeName =
      `${points[0].name || 'START'}-` +
      `${points[points.length-1].name || 'END'} WIND OPT`;

    const rows =
      points.map((p,i)=>{
        const name =
          p.name ||
          `OPT${String(i).padStart(3,'0')}`;

        return (
          `    <rtept lat="${Number(p.lat).toFixed(6)}" ` +
          `lon="${Number(p.lon).toFixed(6)}">\n` +
          `      <name>${escapeXml(name)}</name>\n` +
          `      <overfly>false</overfly>\n` +
          `    </rtept>`
        );
      }).join('\n');

    return (
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<gpx xmlns="http://www.topografix.com/GPX/1/1" ' +
      'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" ' +
      'creator="Wind Optimal Route" version="1.1" ' +
      'xsi:schemaLocation="http://www.topografix.com/GPX/1/1 ' +
      'http://www.topografix.com/GPX/1/1/gpx.xsd">\n' +
      '  <rte>\n' +
      `    <name>${escapeXml(routeName)}</name>\n` +
      rows + '\n' +
      '  </rte>\n' +
      '</gpx>\n'
    );
  }


  function coordinateToken(lat,lon){
    const latHem = lat >= 0 ? 'N' : 'S';
    const lonHem = lon >= 0 ? 'E' : 'W';

    const alat = Math.abs(Number(lat));
    const alon = Math.abs(Number(lon));

    let latDeg = Math.floor(alat);
    let latMin = Math.round((alat-latDeg)*60);

    let lonDeg = Math.floor(alon);
    let lonMin = Math.round((alon-lonDeg)*60);

    if(latMin === 60){
      latDeg += 1;
      latMin = 0;
    }

    if(lonMin === 60){
      lonDeg += 1;
      lonMin = 0;
    }

    return (
      String(latDeg).padStart(2,'0') +
      String(latMin).padStart(2,'0') +
      latHem +
      String(lonDeg).padStart(3,'0') +
      String(lonMin).padStart(2,'0') +
      lonHem
    );
  }


  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';

    document.body.appendChild(ta);
    ta.select();

    if(!document.execCommand('copy')){
      throw new Error('브라우저 복사를 사용할 수 없습니다.');
    }

    ta.remove();
  }


  function formatSeconds(sec){
    const s =
      Math.max(
        0,
        Math.round(Number(sec)||0)
      );

    const h = Math.floor(s/3600);
    const m = Math.floor((s%3600)/60);

    return `${h}:${String(m).padStart(2,'0')}`;
  }


  function signed(value,suffix=''){
    const n = Number(value)||0;

    return (
      (n>=0?'+':'') +
      n.toFixed(1) +
      suffix
    );
  }


  function escapeHtml(s){
    return String(s).replace(
      /[&<>'"]/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[c])
    );
  }


  function escapeXml(s){
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&apos;');
  }

  function startWindAppAfterAuth(){
    if(WIND_APP_STARTED) return;
    WIND_APP_STARTED = true;
    $('analysisDate').value = utcTodayString();
  }

  (function waitForPortalAuth(){
    // common-auth.js가 현재 앱 권한을 확인한 경우에만 실행
    if(window.CURRENT_PORTAL_USER){
      startWindAppAfterAuth();
      return;
    }

    setTimeout(waitForPortalAuth, 200);
  })();

})();
</script>
